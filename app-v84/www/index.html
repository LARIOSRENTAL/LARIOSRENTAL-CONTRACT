<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Larios Rental Pro</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;min-height:100vh;background:#fff}.top{padding:calc(18px + env(safe-area-inset-top)) 20px 18px;background:#111827;color:#fff}.top h1{margin:0;font-size:24px}.top p{margin:5px 0;color:#cbd5e1}.status,.muted{font-size:13px;color:#6b7280}.top .status{color:#cbd5e1}.content{padding:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #e5e7eb;border-radius:16px;padding:18px;background:#fff;min-height:100px;text-align:left}.card b{display:block;font-size:17px;margin-bottom:7px}.card span{color:#6b7280;font-size:13px}.wide{grid-column:1/-1}.section{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280}.notice{padding:14px;border-radius:12px;background:#f3f4f6;font-size:14px}.hidden{display:none!important}input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #d1d5db;border-radius:10px;font-size:16px}label{font-size:12px;color:#6b7280}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 12px}.primary,.secondary{padding:13px;border:0;border-radius:10px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.back{border:0;background:#eee;border-radius:9px;padding:9px 12px}.row{border-bottom:1px solid #eee;padding:13px 2px}.row b{display:block}.agenda{display:grid;grid-template-columns:1fr 1fr;gap:14px}.agendaCol{border:1px solid #e5e7eb;border-radius:14px;padding:10px}.agendaCol h3{margin:5px}.agendaItem{padding:10px;margin:7px 0;border:1px solid #e5e7eb;border-radius:10px}.agendaItem b,.agendaItem span{display:block}.agendaItem span{font-size:12px;color:#6b7280;margin:4px 0}.agendaItem button{width:100%;padding:8px;border:0;border-radius:8px}.agendaItem.locked button{background:#dc2626;color:#fff}.agendaItem.picked{background:#fee2e2;border-color:#ef4444}.foot{padding:20px;color:#9ca3af;text-align:center;font-size:12px}@media(max-width:600px){.grid,.formGrid,.agenda{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="app"><header class="top"><h1>Larios Rental Pro</h1><p>Gestión móvil de alquileres</p><div id="status" class="status">Iniciando…</div></header><main class="content">
<section id="login" class="hidden"><div class="section">Acceso de empleados</div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button class="primary" style="width:100%" onclick="login()">Entrar</button><p id="loginError" class="muted"></p></section>
<section id="home" class="hidden"><div class="actions"><button class="primary" onclick="LariosReservations.openNew()">+ Nueva reserva</button><button class="secondary" onclick="LariosReservations.loadAgenda()">Actualizar agenda</button></div><div class="section">Agenda de hoy</div><div id="agenda" class="agenda"></div><div class="section">Operaciones</div><div class="grid"><button class="card" onclick="openScreen('customers')"><b>Clientes</b><span id="n-customers">—</span></button><button class="card" onclick="openScreen('vehicles')"><b>Vehículos</b><span id="n-vehicles">—</span></button><button class="card" onclick="openScreen('contracts')"><b>Contratos</b><span id="n-contracts">—</span></button><button class="card" onclick="openScreen('documents')"><b>Documentos</b><span id="n-documents">—</span></button><button class="card" onclick="openScreen('drivers')"><b>Conductores</b><span id="n-drivers">—</span></button><button class="card" onclick="openScreen('damages')"><b>Daños</b><span id="n-damages">—</span></button><button class="card wide" onclick="openScreen('renthub_sync_log')"><b>Sincronización Renthub</b><span id="n-renthub_sync_log">—</span></button></div><div class="section">Tarifas</div><div id="pricing" class="notice">Cargando precios…</div><button class="secondary" style="width:100%;margin-top:15px" onclick="logout()">Cerrar sesión</button></section>
<section id="reservation" class="hidden"><div class="toolbar"><button class="back" onclick="LariosReservations.close()">←</button><b id="reservationTitle">Nueva reserva</b></div><form id="reservationForm" onsubmit="return false"><div class="section">Cliente</div><div class="formGrid"><input id="customer_name" placeholder="Nombre y apellidos *"><input id="customer_document" placeholder="DNI / Pasaporte"><input id="customer_email" type="email" placeholder="Email (opcional)"><input id="customer_phone" placeholder="Teléfono"><input id="customer_nationality" placeholder="Nacionalidad"><input id="customer_address" placeholder="Dirección"><input id="driving_license" placeholder="Permiso conducir"><input id="license_issued_by" placeholder="País permiso"><label>Caducidad permiso<input id="license_expiry" type="date"></label></div><div class="section">Vehículo</div><div class="formGrid"><input id="vehicle_group" placeholder="Grupo / categoría"><input id="vehicle_plate" placeholder="Matrícula"><input id="vehicle_model" placeholder="Modelo"><input id="vehicle_color" placeholder="Color"><input id="fuel_type" placeholder="Combustible"></div><div class="section">Entrega y devolución</div><div class="formGrid"><label>Fecha entrega<input id="pickup_date" type="date"></label><label>Hora entrega *<input id="pickup_time" type="time"></label><input id="pickup_location" placeholder="Lugar entrega"><span></span><label>Fecha devolución<input id="return_date" type="date"></label><label>Hora devolución<input id="return_time" type="time"></label><input id="return_location" placeholder="Lugar devolución"><input id="rental_days" type="number" min="1" value="1" placeholder="Días"></div><div class="section">Importes</div><div class="formGrid"><input id="rental_price" type="number" step="0.01" placeholder="Alquiler €"><label><input id="full_insurance" type="checkbox" style="width:auto"> Seguro completo</label><input id="insurance_total" type="number" step="0.01" placeholder="Seguro €"><input id="discount_percent" type="number" step="0.01" placeholder="Descuento %"><input id="vat_percent" type="number" step="0.01" value="21" placeholder="IVA %"><input id="contract_total" type="number" step="0.01" placeholder="Total €"><input id="deposit" type="number" step="0.01" placeholder="Depósito €"><input id="payment_method" placeholder="Forma de pago"></div><div class="actions"><button class="secondary" onclick="LariosReservations.save('draft')">Guardar reserva</button><button class="primary" onclick="LariosReservations.save('confirmed')">Generar contrato</button></div></form></section>
<section id="list" class="hidden"><div class="toolbar"><button class="back" onclick="showHome()">←</button><b id="listTitle"></b></div><div id="rows"></div></section></main><footer class="foot">Larios Rental · V8.4 Android</footer></div><script src="config.js"></script><script>
const cfg=window.LARIOS_CONFIG||{};let token=null;const labels={customers:'Clientes',vehicles:'Vehículos',contracts:'Contratos',documents:'Documentos',drivers:'Conductores',damages:'Daños',renthub_sync_log:'Sincronización Renthub'};function hdr(){return {'apikey':cfg.supabasePublishableKey,'Authorization':'Bearer '+token,'Content-Type':'application/json'}}async function api(path,opt={}){const r=await fetch(cfg.supabaseUrl+'/rest/v1/'+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}async function login(){loginError.textContent='';try{const r=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||'Acceso rechazado');token=d.access_token;localStorage.setItem('lr_token',token);await boot()}catch(e){loginError.textContent=e.message}}function logout(){localStorage.removeItem('lr_token');token=null;home.classList.add('hidden');list.classList.add('hidden');reservation.classList.add('hidden');login.classList.remove('hidden');status.textContent='Identificación requerida'}async function boot(){token=token||localStorage.getItem('lr_token');if(!token){logout();return}try{await api('pricing?select=id&limit=1');login.classList.add('hidden');list.classList.add('hidden');reservation.classList.add('hidden');home.classList.remove('hidden');status.textContent='Supabase conectado · sesión autenticada';loadDashboard();setTimeout(()=>LariosReservations.loadAgenda(),0)}catch(e){logout()}}async function count(t){try{const r=await fetch(cfg.supabaseUrl+'/rest/v1/'+t+'?select=id',{headers:{...hdr(),Prefer:'count=exact',Range:'0-0'}});const range=r.headers.get('content-range')||'';return range.split('/')[1]||'0'}catch(e){return '—'}}async function loadDashboard(){for(const t of Object.keys(labels))document.getElementById('n-'+t).textContent=(await count(t))+' registros';try{const p=await api('pricing?select=category,pricing_type,day_1,extra_day,franchise&active=eq.true&order=category');pricing.innerHTML=p.length?p.slice(0,6).map(x=>'<div class="row"><b>'+esc(x.category)+'</b><span class="muted">1 día: '+money(x.day_1)+' · Extra: '+money(x.extra_day)+'</span></div>').join(''):'Sin tarifas activas'}catch(e){pricing.textContent='No se pudieron cargar tarifas'}}function showHome(){list.classList.add('hidden');home.classList.remove('hidden');LariosReservations.loadAgenda()}async function openScreen(t){home.classList.add('hidden');list.classList.remove('hidden');listTitle.textContent=labels[t];rows.innerHTML='<p class="muted">Cargando…</p>';try{const fields={customers:'id,full_name,document_number,email,phone',vehicles:'id,registration,make,model,status,current_km',contracts:'id,contract_number,status,delivery_date,return_date,total,renthub_sync_status',documents:'id,document_type,document_number,issuing_country,verified_by_user',drivers:'id,full_name,licence_number,licence_country,expiry_date',damages:'id,damage_type,severity,description,existing_damage',renthub_sync_log:'id,operation,direction,success,error_message,created_at'}[t];const d=await api(t+'?select='+fields+'&order=created_at.desc&limit=100');rows.innerHTML=d.length?d.map(x=>renderRow(t,x)).join(''):'<div class="notice">No hay registros.</div>'}catch(e){rows.innerHTML='<div class="notice">No se pudieron cargar los datos.</div>'}}function renderRow(t,x){let a='',b='';if(t==='customers'){a=x.full_name||'Cliente';b=[x.document_number,x.email,x.phone].filter(Boolean).join(' · ')}if(t==='vehicles'){a=[x.make,x.model].filter(Boolean).join(' ')||'Vehículo';b=[x.registration,x.status].filter(Boolean).join(' · ')}if(t==='contracts'){a='Contrato #'+x.contract_number;b=[x.status,x.delivery_date+' → '+x.return_date,money(x.total)].filter(Boolean).join(' · ')}if(t==='documents'){a=x.document_type||'Documento';b=x.document_number||''}if(t==='drivers'){a=x.full_name||'Conductor';b=x.licence_number||''}if(t==='damages'){a=x.damage_type||'Daño';b=x.description||''}if(t==='renthub_sync_log'){a=(x.operation||'Sync')+' · '+(x.success?'OK':'Error');b=x.error_message||''}return '<div class="row"><b>'+esc(a)+'</b><span class="muted">'+esc(b)+'</span></div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return v==null?'—':Number(v).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}boot();</script><script src="reservations.js"></script></body></html>
