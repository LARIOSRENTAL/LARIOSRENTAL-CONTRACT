<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Larios Rental Pro</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;min-height:100vh;background:#fff}.top{padding:calc(18px + env(safe-area-inset-top)) 20px 18px;background:#111827;color:#fff}.top h1{margin:0;font-size:24px}.top p{margin:5px 0}.status,.muted{font-size:13px;color:#6b7280}.top .status{color:#cbd5e1}.content{padding:20px}.grid,.formGrid,.agenda{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.agendaCol{border:1px solid #e5e7eb;border-radius:16px;padding:15px;background:#fff;text-align:left}.card b{display:block;font-size:17px}.card span{color:#6b7280;font-size:13px}.wide{grid-column:1/-1}.section{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280}.notice{padding:14px;border-radius:12px;background:#f3f4f6}.hidden{display:none!important}input,select,textarea{width:100%;padding:12px;margin:5px 0;border:1px solid #d1d5db;border-radius:10px;font-size:16px}textarea{min-height:130px}label{font-size:12px;color:#6b7280}.primary,.secondary{padding:13px;border:0;border-radius:10px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.back{border:0;background:#eee;border-radius:9px;padding:9px 12px}.row{border-bottom:1px solid #eee;padding:13px 2px}.agendaItem{padding:10px;margin:7px 0;border:1px solid #e5e7eb;border-radius:10px}.agendaItem b,.agendaItem span{display:block}.agendaItem span{font-size:12px;color:#6b7280}.agendaItem button{width:100%;padding:8px;border:0;border-radius:8px}.agendaItem.locked button{background:#dc2626;color:#fff}.agendaItem.picked{background:#fee2e2;border-color:#ef4444}.scanPreview{width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:#eee}.foot{padding:20px;color:#9ca3af;text-align:center;font-size:12px}@media(max-width:600px){.grid,.formGrid,.agenda{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="app"><header class="top"><h1>Larios Rental Pro</h1><p>Gestión móvil de alquileres</p><div id="status" class="status">Iniciando…</div></header><main class="content"><section id="login" class="hidden"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button class="primary" style="width:100%" onclick="signIn()">Entrar</button><p id="loginError" class="muted"></p></section><section id="home" class="hidden"><div class="actions"><button class="primary" onclick="LariosReservations.openNew()">+ Nueva reserva</button><button class="secondary" onclick="LariosReservations.loadAgenda()">Actualizar agenda</button></div><div class="section">Agenda de hoy</div><div id="agenda" class="agenda"></div><div class="section">Operaciones</div><div class="grid"><button class="card" onclick="openScreen('customers')"><b>Clientes</b><span id="n-customers">—</span></button><button class="card" onclick="openScreen('vehicles')"><b>Vehículos</b><span id="n-vehicles">—</span></button><button class="card" onclick="openScreen('contracts')"><b>Contratos</b><span id="n-contracts">—</span></button><button class="card" onclick="openScreen('documents')"><b>Documentos</b><span id="n-documents">—</span></button><button class="card" onclick="openScreen('drivers')"><b>Conductores</b><span id="n-drivers">—</span></button><button class="card" onclick="openScreen('damages')"><b>Daños</b><span id="n-damages">—</span></button><button class="card wide" onclick="openScreen('renthub_sync_log')"><b>Sincronización Renthub</b><span id="n-renthub_sync_log">—</span></button></div><div class="section">Tarifas</div><div id="pricing" class="notice">Cargando…</div><button class="secondary" style="width:100%;margin-top:15px" onclick="logout()">Cerrar sesión</button></section><section id="reservation" class="hidden"><div class="toolbar"><button class="back" onclick="LariosReservations.close()">←</button><b id="reservationTitle">Nueva reserva</b></div><div class="actions"><button class="secondary" onclick="LariosScanner.open('identity')">📷 DNI / Pasaporte / Permiso</button><button class="secondary" onclick="LariosScanner.open('keys')">🔑 Foto llavero</button></div><form id="reservationForm" onsubmit="return false"><div class="section">Cliente</div><div class="formGrid"><input id="customer_name" placeholder="Nombre y apellidos *"><input id="customer_document" placeholder="DNI / Pasaporte"><input id="customer_email" type="email" placeholder="Email (opcional)"><input id="customer_phone" placeholder="Teléfono"><input id="customer_nationality" placeholder="Nacionalidad"><input id="customer_address" placeholder="Dirección"><input id="driving_license" placeholder="Permiso conducir"><input id="license_issued_by" placeholder="País permiso"><label>Caducidad permiso<input id="license_expiry" type="date"></label></div><div class="section">Vehículo</div><div class="formGrid"><input id="vehicle_group" placeholder="Grupo / categoría"><input id="vehicle_plate" placeholder="Matrícula"><input id="vehicle_model" placeholder="Modelo"><input id="vehicle_color" placeholder="Color"><input id="fuel_type" placeholder="Combustible"></div><div class="section">Entrega y devolución</div><div class="formGrid"><label>Fecha entrega<input id="pickup_date" type="date"></label><label>Hora entrega *<input id="pickup_time" type="time"></label><input id="pickup_location" placeholder="Lugar entrega"><span></span><label>Fecha devolución<input id="return_date" type="date"></label><label>Hora devolución<input id="return_time" type="time"></label><input id="return_location" placeholder="Lugar devolución"><input id="rental_days" type="number" min="1" value="1"></div><div class="section">Importes</div><div class="formGrid"><input id="rental_price" type="number" step="0.01" placeholder="Alquiler €"><label><input id="full_insurance" type="checkbox" style="width:auto"> Seguro completo</label><input id="insurance_total" type="number" step="0.01" placeholder="Seguro €"><input id="discount_percent" type="number" step="0.01" placeholder="Descuento %"><input id="vat_percent" type="number" value="21" placeholder="IVA %"><input id="contract_total" type="number" step="0.01" placeholder="Total €"><input id="deposit" type="number" step="0.01" placeholder="Depósito €"><input id="payment_method" placeholder="Forma de pago"></div><div class="actions"><button class="secondary" onclick="LariosReservations.save('draft')">Guardar reserva</button><button class="primary" onclick="LariosReservations.save('confirmed')">Generar contrato</button></div></form></section><section id="scan" class="hidden"><div class="toolbar"><button class="back" onclick="LariosScanner.close()">←</button><b id="scanTitle">Escanear</b></div><p id="scanHelp" class="notice"></p><input id="scanFile" class="hidden" type="file" accept="image/*" capture="environment" onchange="LariosScanner.selected(this)"><button class="primary" style="width:100%" onclick="LariosScanner.choose()">Abrir cámara</button><img id="scanPreview" class="scanPreview hidden" alt="Vista previa"><p id="scanState" class="muted"></p><button class="secondary" style="width:100%" onclick="LariosScanner.upload()">Guardar foto privada</button><div class="section">Texto detectado</div><textarea id="scanText" placeholder="Aquí se incorporará el texto reconocido por el dispositivo. Mientras integramos el reconocimiento nativo, también permite pegar o dictar el texto para probar el rellenado automático."></textarea><button class="primary" style="width:100%" onclick="LariosScanner.apply()">Rellenar contrato</button></section><section id="list" class="hidden"><div class="toolbar"><button class="back" onclick="showHome()">←</button><b id="listTitle"></b></div><div id="rows"></div></section></main><footer class="foot">Larios Rental · V8.4</footer></div><script src="config.js"></script><script>const cfg=window.LARIOS_CONFIG||{};let token=null;const $=id=>document.getElementById(id);const loginSection=$('login'),homeSection=$('home'),reservationSection=$('reservation'),listSection=$('list'),statusEl=$('status'),emailEl=$('email'),passwordEl=$('password'),loginErrorEl=$('loginError'),pricingEl=$('pricing'),rowsEl=$('rows'),listTitleEl=$('listTitle');const labels={customers:'Clientes',vehicles:'Vehículos',contracts:'Contratos',documents:'Documentos',drivers:'Conductores',damages:'Daños',renthub_sync_log:'Sincronización Renthub'};function hdr(){return{apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'}}async function api(path,opt={}){const r=await fetch(cfg.supabaseUrl+'/rest/v1/'+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}async function signIn(){loginErrorEl.textContent='';try{const r=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value,password:passwordEl.value})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||'Acceso rechazado');token=d.access_token;localStorage.setItem('lr_token',token);await boot()}catch(e){loginErrorEl.textContent=e.message}}function logout(){localStorage.removeItem('lr_token');token=null;homeSection.classList.add('hidden');reservationSection.classList.add('hidden');listSection.classList.add('hidden');loginSection.classList.remove('hidden');statusEl.textContent='Identificación requerida'}async function boot(){try{if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)throw Error('Falta configuración de Supabase');token=token||localStorage.getItem('lr_token');if(!token){logout();return}await api('pricing?select=id&limit=1');loginSection.classList.add('hidden');homeSection.classList.remove('hidden');statusEl.textContent='Supabase conectado · sesión autenticada';loadDashboard();setTimeout(()=>window.LariosReservations&&LariosReservations.loadAgenda(),0)}catch(e){console.error(e);statusEl.textContent='Error de inicio: '+e.message;loginSection.classList.remove('hidden')}}async function count(t){try{const r=await fetch(cfg.supabaseUrl+'/rest/v1/'+t+'?select=id',{headers:{...hdr(),Prefer:'count=exact',Range:'0-0'}});return(r.headers.get('content-range')||'').split('/')[1]||'0'}catch(e){return'—'}}async function loadDashboard(){for(const t of Object.keys(labels))$('n-'+t).textContent=(await count(t))+' registros';try{const p=await api('pricing?select=category,day_1,extra_day&active=eq.true&order=category');pricingEl.innerHTML=p.slice(0,6).map(x=>'<div class="row"><b>'+esc(x.category)+'</b><span class="muted">1 día: '+money(x.day_1)+' · Extra: '+money(x.extra_day)+'</span></div>').join('')}catch(e){pricingEl.textContent='No se pudieron cargar tarifas'}}function showHome(){listSection.classList.add('hidden');homeSection.classList.remove('hidden')}async function openScreen(t){homeSection.classList.add('hidden');listSection.classList.remove('hidden');listTitleEl.textContent=labels[t];const fields={customers:'id,full_name,document_number,email,phone',vehicles:'id,registration,make,model,status,current_km',contracts:'id,contract_number,status,delivery_date,return_date,total',documents:'id,document_type,document_number',drivers:'id,full_name,licence_number',damages:'id,damage_type,description',renthub_sync_log:'id,operation,success,error_message'}[t];try{const d=await api(t+'?select='+fields+'&order=created_at.desc&limit=100');rowsEl.innerHTML=d.map(x=>'<div class="row"><b>'+esc(x.full_name||x.registration||x.contract_number||x.document_type||x.damage_type||x.operation||'Registro')+'</b></div>').join('')||'<div class="notice">No hay registros.</div>'}catch(e){rowsEl.innerHTML='<div class="notice">No se pudieron cargar los datos.</div>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return v==null?'—':Number(v).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}window.addEventListener('error',e=>{statusEl.textContent='Error: '+e.message});boot();</script><script src="reservations.js"></script><script src="scanner.js"></script></body></html>
