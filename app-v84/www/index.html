<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Larios Rental Pro</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;min-height:100vh;background:#fff}.top{padding:calc(18px + env(safe-area-inset-top)) 20px 18px;background:#111827;color:#fff}.top h1{margin:0;font-size:24px}.top p{margin:5px 0}.status,.muted{font-size:13px;color:#6b7280}.top .status{color:#cbd5e1}.content{padding:20px}.grid,.formGrid,.agenda{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.agendaCol{border:1px solid #e5e7eb;border-radius:16px;padding:15px;background:#fff;text-align:left}.card b{display:block;font-size:17px}.card span{color:#6b7280;font-size:13px}.wide{grid-column:1/-1}.section{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280}.notice{padding:14px;border-radius:12px;background:#f3f4f6}.hidden{display:none!important}input,select,textarea{width:100%;padding:12px;margin:5px 0;border:1px solid #d1d5db;border-radius:10px;font-size:16px}textarea{min-height:130px}label{font-size:12px;color:#6b7280}.primary,.secondary{padding:13px;border:0;border-radius:10px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1}.agendaPicker{display:flex;gap:10px;align-items:end;margin-top:14px;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#f9fafb}.agendaPicker label{flex:1}.agendaPicker input{background:#fff;margin-bottom:0}.agendaPicker button{white-space:nowrap}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.back{border:0;background:#eee;border-radius:9px;padding:9px 12px}.row{border-bottom:1px solid #eee;padding:13px 2px}.agendaItem{padding:10px;margin:7px 0;border:1px solid #e5e7eb;border-radius:10px}.agendaItem b,.agendaItem span{display:block}.agendaItem span{font-size:12px;color:#6b7280}.agendaItem button{width:100%;padding:8px;border:0;border-radius:8px}.agendaItem.locked button{background:#dc2626;color:#fff}.agendaItem.picked{background:#fee2e2;border-color:#ef4444}.scanPreview{width:100%;max-height:520px;object-fit:contain;border-radius:12px;background:#eee}.foot{padding:20px;color:#9ca3af;text-align:center;font-size:12px}@media(max-width:600px){.grid,.formGrid,.agenda{grid-template-columns:1fr}.wide{grid-column:auto}.agendaPicker{align-items:stretch;flex-direction:column}}</style></head><body><div class="app"><header class="top"><h1>Larios Rental Pro</h1><p>Gestión móvil de alquileres</p><div id="status" class="status">Iniciando…</div></header><main class="content"><section id="login" class="hidden"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button class="primary" style="width:100%" onclick="signIn()">Entrar</button><p id="loginError" class="muted"></p></section><section id="home" class="hidden"><div class="actions"><button class="primary" onclick="LariosReservations.openNew()">+ Nueva reserva</button></div><div class="agendaPicker"><label>Fecha de la agenda<input id="agendaDate" type="date" onchange="changeAgendaDate()"></label><button class="secondary" onclick="goToday()">Hoy</button><button class="secondary" onclick="changeAgendaDate()">Actualizar</button></div><div id="agendaTitle" class="section">Agenda de hoy</div><div id="agenda" class="agenda"></div><div class="section">Operaciones</div><div class="grid"><button class="card" onclick="openScreen('customers')"><b>Clientes</b><span id="n-customers">—</span></button><button class="card" onclick="openScreen('vehicles')"><b>Vehículos</b><span id="n-vehicles">—</span></button><button class="card" onclick="openScreen('contracts')"><b>Contratos</b><span id="n-contracts">—</span></button><button class="card" onclick="openScreen('documents')"><b>Documentos</b><span id="n-documents">—</span></button><button class="card" onclick="openScreen('drivers')"><b>Conductores</b><span id="n-drivers">—</span></button><button class="card" onclick="openScreen('damages')"><b>Daños</b><span id="n-damages">—</span></button><button class="card wide" onclick="openScreen('renthub_sync_log')"><b>Sincronización Renthub</b><span id="n-renthub_sync_log">—</span></button></div><div class="section">Tarifas</div><div id="pricing" class="notice">Cargando…</div><button class="secondary" style="width:100%;margin-top:15px" onclick="logout()">Cerrar sesión</button></section><section id="reservation" class="hidden"><div class="toolbar"><button class="back" onclick="LariosReservations.close()">←</button><b id="reservationTitle">Reserva / contrato</b></div><form id="reservationForm" onsubmit="return false"><div class="notice">Cargando formulario de contrato…</div></form></section><section id="scan" class="hidden"></section><section id="list" class="hidden"><div class="toolbar"><button class="back" onclick="showHome()">←</button><b id="listTitle"></b></div><div id="rows"></div></section></main><footer class="foot">Larios Rental · V8.4 · SCANNER WEB LOCAL · SIN OCR EXTERNO · CONTROLES V2 · GRUPOS SEPARADOS</footer></div><script src="config.js?v=12"></script><script>const cfg=window.LARIOS_CONFIG||{};let token=null;const $=id=>document.getElementById(id);const loginSection=$('login'),homeSection=$('home'),reservationSection=$('reservation'),listSection=$('list'),statusEl=$('status'),emailEl=$('email'),passwordEl=$('password'),loginErrorEl=$('loginError'),pricingEl=$('pricing'),rowsEl=$('rows'),listTitleEl=$('listTitle');const labels={customers:'Clientes',vehicles:'Vehículos',contracts:'Contratos',documents:'Documentos',drivers:'Conductores',damages:'Daños',renthub_sync_log:'Sincronización Renthub'};function localISODate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}function initAgendaDate(){const el=$('agendaDate');if(el&&!el.value)el.value=localISODate()}function changeAgendaDate(){initAgendaDate();const d=$('agendaDate').value;const today=localISODate();const title=$('agendaTitle');if(title){if(d===today)title.textContent='Agenda de hoy';else{const parts=d.split('-').map(Number);title.textContent='Agenda · '+new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(parts[0],parts[1]-1,parts[2]))}}if(window.LariosReservations)LariosReservations.loadAgenda(d)}function goToday(){const el=$('agendaDate');if(el)el.value=localISODate();changeAgendaDate()}function saveSession(d){if(!d||!d.access_token)return;token=d.access_token;localStorage.setItem('lr_token',d.access_token);if(d.refresh_token)localStorage.setItem('lr_refresh_token',d.refresh_token);if(d.expires_at)localStorage.setItem('lr_expires_at',String(d.expires_at))}function clearSession(){localStorage.removeItem('lr_token');localStorage.removeItem('lr_refresh_token');localStorage.removeItem('lr_expires_at');token=null}async function refreshSession(){const refresh=localStorage.getItem('lr_refresh_token');if(!refresh)return false;try{const r=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})}),d=await r.json();if(!r.ok||!d.access_token)throw new Error(d.msg||d.error_description||'No se pudo renovar la sesión');saveSession(d);return true}catch(e){console.warn('No se pudo renovar la sesión',e);clearSession();return false}}function hdr(){return{apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'}}async function api(path,opt={},retry=true){const r=await fetch(cfg.supabaseUrl+'/rest/v1/'+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});if((r.status===401||r.status===403)&&retry){const body=await r.text();if(/JWT expired|PGRST303|expired/i.test(body)){const ok=await refreshSession();if(ok)return api(path,opt,false);throw Error('La sesión ha caducado. Vuelve a iniciar sesión.')}if(!r.ok)throw Error(body);return body?JSON.parse(body):null}if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}async function signIn(){loginErrorEl.textContent='';try{const r=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value,password:passwordEl.value})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||'Acceso rechazado');saveSession(d);await boot()}catch(e){loginErrorEl.textContent=e.message}}function logout(showMessage=true){clearSession();homeSection.classList.add('hidden');reservationSection.classList.add('hidden');listSection.classList.add('hidden');loginSection.classList.remove('hidden');statusEl.textContent=showMessage?'Identificación requerida':'Sesión caducada · inicia sesión de nuevo'}async function boot(){try{if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)throw Error('Falta configuración de Supabase');token=token||localStorage.getItem('lr_token');const exp=Number(localStorage.getItem('lr_expires_at')||0);if((!token||(exp&&Date.now()/1000>exp-30))&&localStorage.getItem('lr_refresh_token'))await refreshSession();token=token||localStorage.getItem('lr_token');if(!token){logout();return}await api('pricing?select=id&limit=1');loginSection.classList.add('hidden');homeSection.classList.remove('hidden');statusEl.textContent='Supabase conectado · sesión autenticada';initAgendaDate();loadDashboard();setTimeout(()=>changeAgendaDate(),0)}catch(e){console.error(e);if(/JWT expired|PGRST303|sesión ha caducado|sesion ha caducado/i.test(e.message)){logout(false);loginErrorEl.textContent='La sesión anterior había caducado. Introduce tus credenciales para continuar.'}else{statusEl.textContent='Error de inicio: '+e.message;loginSection.classList.remove('hidden')}}}async function count(t){try{const r=await fetch(cfg.supabaseUrl+'/rest/v1/'+t+'?select=id',{headers:{...hdr(),Prefer:'count=exact',Range:'0-0'}});return(r.headers.get('content-range')||'').split('/')[1]||'0'}catch(e){return'—'}}async function loadDashboard(){for(const t of Object.keys(labels))$('n-'+t).textContent=(await count(t))+' registros';try{const p=await api('pricing?select=category,day_1,extra_day&active=eq.true&order=category');pricingEl.innerHTML=p.slice(0,6).map(x=>'<div class="row"><b>'+esc(x.category)+'</b><span class="muted">Tarifa configurada</span></div>').join('')}catch(e){pricingEl.textContent='No se pudieron cargar tarifas'}}function showHome(){listSection.classList.add('hidden');homeSection.classList.remove('hidden')}async function openScreen(t){homeSection.classList.add('hidden');listSection.classList.remove('hidden');listTitleEl.textContent=labels[t];const fields={customers:'id,full_name,document_number,email,phone',vehicles:'id,registration,make,model,status,current_km',contracts:'id,contract_number,status,delivery_date,return_date,total',documents:'id,document_type,document_number',drivers:'id,full_name,licence_number',damages:'id,damage_type,description',renthub_sync_log:'id,operation,success,error_message'}[t];try{const d=await api(t+'?select='+fields+'&order=created_at.desc&limit=100');rowsEl.innerHTML=d.map(x=>'<div class="row"><b>'+esc(x.full_name||x.registration||x.contract_number||x.document_type||x.damage_type||x.operation||'Registro')+'</b></div>').join('')||'<div class="notice">No hay registros.</div>'}catch(e){rowsEl.innerHTML='<div class="notice">No se pudieron cargar los datos.</div>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}function money(v){return v==null?'—':Number(v).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}window.addEventListener('error',e=>{statusEl.textContent='Error: '+e.message});boot();</script><script src="reservations.js?v=4"></script><script src="agenda-pdf-v1.js?v=1"></script><script src="scanner.js?v=4"></script><script src="larios-fixes.js?v=7"></script><script src="contract-flow-final.js?v=6"></script><script src="v84-corrections.js?v=1"></script><script src="validation-errors.js?v=1"></script><script src="rental-period-sync.js?v=3"></script><script src="final-authority.js?v=10"></script><script src="runtime-hotfix.js?v=1"></script><script src="pdf-authority-v2.js?v=1"></script><script src="pdf-layout-hotfix.js?v=1"></script><script src="scanner-v5.js?v=v6web-free6-20260901"></script><script src="scanner-open-guard-v6.js?v=3"></script><script src="scanner-lock-v6.js?v=4"></script><script src="contract-lifecycle-v6.js?v=12"></script></body></html>
