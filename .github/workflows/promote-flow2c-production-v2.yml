name: Promote Flow 2C Production V2

on:
  push:
    branches:
      - agent/mobile-v84
    paths:
      - .github/workflows/promote-flow2c-production-v2.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-v84
          fetch-depth: 0
      - name: Fetch validated test branch
        run: git fetch origin test/mobile-v84:refs/remotes/origin/test/mobile-v84
      - name: Copy validated generic files
        run: |
          git show origin/test/mobile-v84:app-v84/www/reservation-quick-v3.js > app-v84/www/reservation-quick-v3.js
          git show origin/test/mobile-v84:app-v84/www/reservation-quick-v4.js > app-v84/www/reservation-quick-v4.js
          git show origin/test/mobile-v84:app-v84/www/workflow-improvements-v1.js > app-v84/www/workflow-improvements-v1.js
          git show origin/test/mobile-v84:app-v84/www/contract-flow-final.js > app-v84/www/contract-flow-final.js
          git show origin/test/mobile-v84:app-v84/www/reservation-compact-v1.js > app-v84/www/reservation-compact-v1.js
      - name: Patch production-specific Stripe and guarantees
        run: python3 scripts/promote_flow2c_prod.py
      - name: Validate JavaScript
        run: |
          node --check app-v84/www/reservation-quick-v3.js
          node --check app-v84/www/reservation-quick-v4.js
          node --check app-v84/www/workflow-improvements-v1.js
          node --check app-v84/www/contract-flow-final.js
          node --check app-v84/www/reservation-compact-v1.js
          node --check app-v84/www/stripe-bridge-v1.js
          node --check app-v84/www/payment-methods-v1.js
          node --check app-v84/www/guarantee-panel-v1.js
      - name: Commit production runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v84/www
          git commit -m "Promote validated Flow 2C runtime to production"
          git push origin HEAD:agent/mobile-v84
