          function field(raw,label){const r=new RegExp('(?:^|\\n)\\s*\\*?'+label+'\\s*:?\\s*([^\\n]+)','i'),m=raw.match(r);return m?m[1].trim():''}
          function verbose(raw){const gi=groupInfo(raw),today=localDate();let pickupDate=dateFrom(field(raw,'Fecha de entrega')||field(raw,'Duraci[oó]n del alquiler')||raw),pickupTime=timeFrom(field(raw,'Hora de entrega')||field(raw,'Entrega')||raw);let returnDate=dateFrom(field(raw,'Fecha de recogida')),returnTime=timeFrom(field(raw,'Hora de recogida')||field(raw,'Hora')||'');let pickupLocation=field(raw,'Direcci[oó]n de entrega')||field(raw,'Entrega en'),returnLocation=field(raw,'Direcci[oó]n de recogida');if(!returnLocation||/misma ubicacion/i.test(returnLocation)||/misma ubicacion/i.test(field(raw,'Fecha de recogida')))returnLocation=pickupLocation;if(!returnDate&&pickupDate)returnDate=addDays(pickupDate,Math.max(1,Number((field(raw,'Dias de alquiler').match(/\d+/)||[])[0]||1)));let days=Math.max(1,Number((field(raw,'Dias de alquiler').match(/\d+/)||[])[0]||0)||diffDays(pickupDate,returnDate));if(!returnDate)returnDate=addDays(pickupDate||today,days);if(!returnTime)returnTime=pickupTime||'09:00';let name=field(raw,'Nombre cliente')||field(raw,'Nombre'),phone=field(raw,'Tel[eé]fono cliente')||field(raw,'Tel[eé]fono')||phoneFrom(raw),amount=totalFrom(raw);if(!pickupDate)pickupDate=today;if(!pickupTime)pickupTime='09:00';return{status:'draft',customer_name:name||'Pendiente',customer_document:'',customer_email:'',customer_phone:phone,customer_nationality:'',customer_address:'',driving_license:'',license_issued_by:'',license_expiry:'',vehicle_group:gi.group,vehicle_quantity:String(gi.quantity||1),vehicle_plate:'',vehicle_model:'',vehicle_color:'',fuel_type:'',pickup_date:pickupDate,pickup_time:pickupTime,pickup_location:pickupLocation,return_date:returnDate,return_time:returnTime,return_location:returnLocation||pickupLocation,rental_days:String(days),rental_price:amount?String(amount):'0',full_insurance:false,insurance_total:'0',discount_percent:'0',vat_percent:'21',total:amount?String(amount):'0',deposit:'0',payment_method:'',reservation_detail:'',whatsapp_message:raw,agency:collaborator(raw)}}
          function compact(raw){if(!old)throw new Error('Parser base no disponible');let s=String(raw||'').trim(),day='';if(/\b(?:hoy|ahora)\b/i.test(s)){day='today';s=s.replace(/\b(?:hoy|ahora)\b/ig,' ')}else if(/\bma[nñ]ana\b/i.test(s)){day='tomorrow';s=s.replace(/\bma[nñ]ana\b/ig,' ')}const phone=phoneFrom(s);if(phone)s=s.replace(phone,' ');const p=old(s.replace(/\s+/g,' ').trim());const gi=groupInfo(raw);if(gi.group){p.vehicle_group=gi.group;p.vehicle_quantity=String(gi.quantity||1)}if(day==='today')p.pickup_date=localDate();if(day==='tomorrow')p.pickup_date=addDays(localDate(),1);if(day)p.return_date=addDays(p.pickup_date,Math.max(1,Number(p.rental_days)||1));if(phone)p.customer_phone=phone;const nm=String(raw).match(/\b\d+\s*(?:d[ií]a|d[ií]as|dia|dias|d)\b\s+([A-Za-zÀ-ÿ' -]{2,50}?)\s+(?=\+\d)/i);if(nm){p.customer_name=nm[1].trim();if(p.pickup_location?.endsWith(p.customer_name))p.pickup_location=p.pickup_location.slice(0,-p.customer_name.length).trim()}p.return_location=p.return_location||p.pickup_location;p.agency=collaborator(raw);return p}
