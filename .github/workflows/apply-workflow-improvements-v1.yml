name: Apply workflow improvements v1

on:
  push:
    branches: [test/mobile-v84]
    paths:
      - ".github/workflows/apply-workflow-improvements-v1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/mobile-v84
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write workflow improvements
        run: |
          cat > app-v84/www/reservation-quick-v3.js <<'JS'
          (function(){
          'use strict';
          const old=window.LariosQuickReservationV2?.parseQuick;
          const pad=n=>String(n).padStart(2,'0');
          function localDate(d=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);return p.find(x=>x.type==='year').value+'-'+p.find(x=>x.type==='month').value+'-'+p.find(x=>x.type==='day').value}
          function addDays(iso,n){const p=String(iso).split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2]));d.setUTCDate(d.getUTCDate()+Number(n||0));return d.toISOString().slice(0,10)}
          function diffDays(a,b){if(!a||!b)return 1;const x=new Date(a+'T00:00:00Z'),y=new Date(b+'T00:00:00Z');return Math.max(1,Math.round((y-x)/86400000))}
          function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
          const months={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
          function explicit(day,month,year){const today=localDate(),y=year||Number(today.slice(0,4));let d=new Date(Date.UTC(y,month-1,day)),iso=d.toISOString().slice(0,10);if(!year&&iso<today){d=new Date(Date.UTC(y+1,month-1,day));iso=d.toISOString().slice(0,10)}return iso}
          function dateFrom(s){const t=norm(s);let m=t.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);if(m){let y=m[3]?Number(m[3]):0;if(y&&y<100)y+=2000;return explicit(Number(m[1]),Number(m[2]),y||undefined)}m=t.match(/\b(\d{1,2})\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b/);return m?explicit(Number(m[1]),months[m[2]]):''}
          function timeFrom(s){const t=norm(s);let m=t.match(/\b(\d{1,2})(?::|\.)(\d{2})\s*(am|pm)?\b/);if(!m)return /manana temprano/.test(t)?'09:00':'';let h=Number(m[1]),min=Number(m[2]);if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;return pad(h)+':'+pad(min)}
          function groupInfo(s){const t=norm(s);let q=1,g='';let m=t.match(/\bx\s*(\d+)\b/);if(m)q=Math.max(1,Number(m[1]));m=t.match(/\b(\d+)\s*x\s*(?:yamaha\s+neos\s*)?(50\s*cc|125\s*cc|e-?bikes?|bicicletas?|bicis?)\b/);if(m){q=Math.max(1,Number(m[1]));g=m[2]}if(!g){m=t.match(/\b(?:yamaha\s+neos\s*)?(50\s*cc|125\s*cc|e-?bikes?|bicicletas?|bicis?)\b/);if(m)g=m[1]}if(!g){m=t.match(/\b(?:coche|grupo|g)\s*:?\s*([a-z0-9-]+)\b/);if(m)g=m[1]}g=String(g||'').replace(/\s+/g,'');if(/^50cc$/i.test(g))g='50cc';else if(/^125cc$/i.test(g))g='125cc';else if(/e-?bikes?/i.test(g))g='E-BIKE';else if(/bici/i.test(g))g='BICICLETA';else g=g.toUpperCase();return{group:g,quantity:q}}
          function phoneFrom(s){const m=String(s||'').match(/\+\d[\d\s\u00a0-]{7,}\d/);return m?m[0].replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim():''}
          function collaborator(s){const t=' '+norm(s)+' ';const defs=[['ELE APARTAMENT',/\b(?:ele\s*apart(?:ament|amentos)?|l\s*apart(?:ament|amentos)?)\b/],['SOL MAESTRANZA',/\bsol\s+maestranza\b/],['CITY EXPERT',/\bcity\s+expert\b/],['DULCE HOGAR',/\bdulce\s+hogar\b/],['INMOSWISS',/\binmoswiss\b/],['PARQUE FLAT',/\bparque\s+flat\b/]];return defs.find(([,r])=>r.test(t))?.[0]||''}
