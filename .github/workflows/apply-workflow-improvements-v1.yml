          function ensureCashBox(){if($('cash_without_card'))return;const anchor=$('card_expiry')?.closest('label')||$('card_number')?.closest('label');if(!anchor)return;const l=document.createElement('label');l.id='lrCashNoCardLabel';l.className='wide lrCashNoCard';l.innerHTML='<input id="cash_without_card" type="checkbox"> <span><b>Efectivo sin tarjeta</b><small>Marca esta casilla cuando el cliente paga en efectivo y no se guardarán datos de tarjeta.</small></span>';anchor.parentElement?.insertBefore(l,anchor.nextSibling);$('cash_without_card').addEventListener('change',()=>{const on=$('cash_without_card').checked;$('card_number')?.classList.toggle('lrOptionalCard',on);$('card_expiry')?.classList.toggle('lrOptionalCard',on)})}
          async function hydrate(){ensureCashBox();const id=window.LariosCurrentContractId||'';if(!id)return;try{const r=await loadRecord(id);if(id!==window.LariosCurrentContractId)return;if($('cash_without_card'))$('cash_without_card').checked=r?.cash_without_card===true||String(r?.cash_without_card)==='true';if($('agency')&&!$('agency').value&&r?.agency)$('agency').value=r.agency}catch(e){console.warn('Workflow hydrate',e)}}
          function currentStatus(){return recordId===window.LariosCurrentContractId&&record?.status?record.status:'draft'}
          async function saveOpenReservation(){const id=window.LariosCurrentContractId||'';if(!id)throw Error('No hay una reserva abierta.');const prior=await loadRecord(id).catch(()=>null);let p=window.LariosStripeBridge?.payload?.();if(!p)throw Error('El formulario todavía no está preparado para guardarse.');p.id=id;p.status=prior?.status||'draft';p.payment_method=$('payment_method')?.value||p.payment_method||'';p.cash_without_card=!!$('cash_without_card')?.checked;p.agency=$('agency')?.value||prior?.agency||'';const saved=await rpc('app_save_contract',{p_payload:p});record=saved;recordId=saved?.id||id;window.LariosCurrentContractId=recordId;sessionStorage.setItem('lr_resume_contract',recordId);return saved}
          async function resumeContract(id){if(!id)return;sessionStorage.setItem('lr_resume_contract',id);clearTimeout(resumeTimer);let tries=0;const run=async()=>{tries++;try{const r=await loadRecord(id);if(window.LariosReservations?.loadAgenda)await window.LariosReservations.loadAgenda(r?.pickup_date||$('agendaDate')?.value);if(window.LariosReservations?.edit){window.LariosReservations.edit(id);sessionStorage.removeItem('lr_resume_contract');setTimeout(hydrate,250);return}}catch(e){console.warn('Reabrir reserva',e)}if(tries<30)resumeTimer=setTimeout(run,300)};run()}
          async function markDone(id){if(!confirm('¿Marcar este contrato como ya realizado manualmente o en Renthub?\n\nNo se generará un PDF nuevo.'))return;try{const r=await loadRecord(id);const p={...r,id,status:'confirmed',contract_already_done:true,contract_done_source:'manual_or_renthub'};await rpc('app_save_contract',{p_payload:p});record=null;recordId='';await window.LariosReservations?.loadAgenda?.($('agendaDate')?.value);decorateAgenda()}catch(e){alert('No se pudo marcar el contrato como realizado: '+e.message)}}
          function decorateAgenda(){const snap=window.LariosReservations?.getAgendaSnapshot?.();if(!snap)return;const cols=document.querySelectorAll('#agenda .agendaCol'),cards=cols[0]?.querySelectorAll('.agendaItem.rich')||[];(snap.deliveries||[]).forEach((x,i)=>{const c=cards[i];if(!c)return;const done=x.status!=='draft'||x.contract_already_done===true;c.classList.toggle('lrContractDone',done);let b=c.querySelector('.lrAlreadyDone');if(!done&&!b){b=document.createElement('button');b.type='button';b.className='lrAlreadyDone';b.textContent='Contrato ya realizado';b.onclick=e=>{e.preventDefault();e.stopPropagation();markDone(x.id)};c.appendChild(b)}if(done&&b)b.remove()})}
          let agendaTimer=0;function scheduleAgenda(){if(!agendaTimer)agendaTimer=setTimeout(()=>{agendaTimer=0;decorateAgenda()},0)}
          function boot(){ensureCashBox();const section=$('reservation');if(section)new MutationObserver(()=>{if(!section.classList.contains('hidden'))setTimeout(hydrate,80)}).observe(section,{attributes:true,attributeFilter:['class']});const agenda=$('agenda');if(agenda)new MutationObserver(scheduleAgenda).observe(agenda,{childList:true,subtree:true});scheduleAgenda();const q=new URLSearchParams(location.search),target=q.get('contract_id')||sessionStorage.getItem('lr_resume_contract');if(target)setTimeout(()=>resumeContract(target),700)}
          const style=document.createElement('style');style.textContent='.lrCashNoCard{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:#f9fafb}.lrCashNoCard input{width:auto;margin-top:3px}.lrCashNoCard span{display:grid;gap:2px}.lrCashNoCard small{color:#6b7280}.lrContractDone{background:#fee2e2!important;border-color:#ef4444!important}.lrContractDone:before{background:#dc2626!important;box-shadow:0 0 0 4px #fee2e2!important}.lrAlreadyDone{margin-left:8px!important;color:#991b1b!important;border-color:#fecaca!important}';document.head.appendChild(style);
          window.LariosWorkflow={saveOpenReservation,resumeContract,currentStatus,hydrate,markDone,version:'workflow-v1'};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
