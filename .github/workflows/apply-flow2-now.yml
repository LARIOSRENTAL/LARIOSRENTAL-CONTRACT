name: Apply Flow 2 now

on:
  push:
    branches:
      - test/mobile-v84

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/mobile-v84
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate Flow 2
        run: python scripts/apply-workflow-improvements-v2.py
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v84/www
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "Apply Flow 2 reservation improvements"
          git push origin HEAD:test/mobile-v84
