name: Publish V8.4 Web Preview

# Production stays at root. Isolated test branch is published under /pruebas/.
on:
  workflow_dispatch:
  push:
    branches: [agent/mobile-v84]
    paths:
      - "app-v84/www/**"
      - "static/assets/**"
      - "static/vendor/**"
      - ".github/workflows/web-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-v84
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/mobile-v84
          path: test-source
      - uses: actions/configure-pages@v5
      - name: Prepare production and isolated test site
        run: |
          mkdir -p app-v84/www/assets app-v84/www/vendor
          cp static/assets/contrato-larios-normalizado.pdf app-v84/www/assets/
          cp static/assets/damage-map.png app-v84/www/assets/
          cp static/vendor/pdf-lib.min.js app-v84/www/vendor/
          rm -rf app-v84/www/pruebas
          mkdir -p app-v84/www/pruebas
          cp -R test-source/app-v84/www/. app-v84/www/pruebas/
          mkdir -p app-v84/www/pruebas/assets app-v84/www/pruebas/vendor
          cp test-source/static/assets/contrato-larios-normalizado.pdf app-v84/www/pruebas/assets/
          cp test-source/static/assets/damage-map.png app-v84/www/pruebas/assets/
          cp test-source/static/vendor/pdf-lib.min.js app-v84/www/pruebas/vendor/
      - name: Force fresh JavaScript and load quick parser authority last
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ['BUILD_SHA'][:12]
          prod = Path('app-v84/www/index.html')
          test = Path('app-v84/www/pruebas/index.html')

          for path in (prod, test):
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'src="([^"]+\.js)(?:\?[^"]*)?"',
                  lambda m: f'src="{m.group(1)}?v={version}"',
                  text,
              )
              path.write_text(text, encoding='utf-8')

          if prod.exists():
              text = prod.read_text(encoding='utf-8')
              text = re.sub(
                  r'<script[^>]+src="quick-reservation-authority-v1\.js[^\"]*"[^>]*></script>',
                  '',
                  text,
              )
              tag = f'<script src="quick-reservation-authority-v1.js?v={version}"></script>'
              text = text.replace('</body>', tag + '</body>')
              prod.write_text(text, encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-v84/www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
