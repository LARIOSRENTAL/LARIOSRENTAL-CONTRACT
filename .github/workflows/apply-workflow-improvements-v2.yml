name: Apply workflow improvements v2

on:
  push:
    branches:
      - test/mobile-v84
    paths:
      - .github/workflows/apply-workflow-improvements-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/mobile-v84
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python scripts/apply-workflow-improvements-v2.py
      - name: Commit reviewed TEST changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v84/www
          git diff --cached --quiet && exit 0
          git commit -m "Apply reservation workflow improvements in TEST"
          git push origin HEAD:test/mobile-v84
