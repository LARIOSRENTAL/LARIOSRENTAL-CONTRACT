name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [agent/mobile-v84]
    paths:
      - "app-v84/**"
      - "static/assets/**"
      - "static/vendor/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-v84
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Bundle contract assets for offline Android WebView
        run: |
          mkdir -p www/assets www/vendor
          cp ../static/assets/contrato-larios-normalizado.pdf www/assets/
          cp ../static/assets/damage-map.png www/assets/
          cp ../static/vendor/pdf-lib.min.js www/vendor/
      - name: Verify production web bundle
        run: |
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/config.js
          test -f www/assets/contrato-larios-normalizado.pdf
          test -f www/assets/damage-map.png
          test -f www/vendor/pdf-lib.min.js
          grep -q "Larios Rental Pro" www/index.html
          npx cap --version
      - name: Create Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Set a newer Android version for each build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          code = int(os.environ['RUN_NUMBER'])
          text, count = re.subn(r'versionCode\s+\d+', f'versionCode {code}', text, count=1)
          if count != 1:
              raise SystemExit('Missing Android versionCode')
          text, count = re.subn(r'versionName\s+"[^"]+"', f'versionName "8.4.{code}"', text, count=1)
          if count != 1:
              raise SystemExit('Missing Android versionName')
          path.write_text(text)
          PY
      - name: Configure release signing when credentials are available
        env:
          KEYSTORE_BASE64: ${{ secrets.LR_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LR_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LR_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LR_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Incomplete Android signing credentials" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/larios-release.jks
          keytool -list -keystore android/app/larios-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          marker = '    buildTypes {'
          if text.count(marker) != 1:
              raise SystemExit('Cannot locate Android buildTypes block')
          signing = '''    signingConfigs {
                  release {
                      storeFile file('larios-release.jks')
                      storePassword System.getenv('LR_ANDROID_STORE_PASSWORD')
                      keyAlias System.getenv('LR_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('LR_ANDROID_KEY_PASSWORD')
                  }
              }
              '''
          text = text.replace(marker, signing + marker, 1)
          text, count = re.subn(r'(buildTypes\s*\{\s*release\s*\{)',
                                r'\1\n            signingConfig signingConfigs.release', text, count=1)
          if count != 1:
              raise SystemExit('Cannot locate Android release block')
          path.write_text(text)
          PY
          echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.SIGNED_BUILD == 'true'
        env:
          LR_ANDROID_STORE_PASSWORD: ${{ secrets.LR_ANDROID_STORE_PASSWORD }}
          LR_ANDROID_KEY_ALIAS: ${{ secrets.LR_ANDROID_KEY_ALIAS }}
          LR_ANDROID_KEY_PASSWORD: ${{ secrets.LR_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Build test APK
        if: env.SIGNED_BUILD != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Name and verify installable APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p dist
          if [[ "$SIGNED_BUILD" == 'true' ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/Larios-Rental-Android-8.4.${RUN_NUMBER}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Larios-Rental-Android-PRUEBA-8.4.${RUN_NUMBER}.apk"
          fi
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          test -s dist/*.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: larios-rental-android-${{ env.SIGNED_BUILD == 'true' && 'firmado' || 'prueba' }}
          path: app-v84/dist/
          if-no-files-found: error
          retention-days: 90
